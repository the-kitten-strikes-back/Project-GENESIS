[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-genesis"
version = "0.1.0"
description = "Digital life simulator with evolution, competition, and learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "GENESIS" }]
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
pygame = ["pygame>=2.6"]

[project.scripts]
genesis = "genesis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
